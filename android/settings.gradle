pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins {
    id("com.facebook.react.settings")
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
        maven { url = uri("${rootDir}/../node_modules/@notifee/react-native/android/libs") }
        maven { url = uri("${rootDir}/../node_modules/react-native/android") }
        maven { url = uri("${rootDir}/../node_modules/jsc-android/dist") }
    }
}

rootProject.name = "Pryvo"

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(["node", "../node_modules/@react-native-community/cli/build/bin.js", "config"])
}

include(":app")
